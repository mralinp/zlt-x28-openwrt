name: Sign image

# Manual (#476): signs a sysupgrade image that the owner attached to a release as x28-sysupgrade-<version>-unsigned.tar. The signer key and
# its ucert certificate (base64: `base64 < signer.ucert | gh secret set X28_IMAGE_SIGNER_CERT --env release-signing`) are secrets of the `release-signing` environment (restrict it to main and require a reviewer); the feed key is NOT
# here: it stayed offline and only certified the signer (tools/build/image_sign.sh gen-signer). The signed file x28-sysupgrade-<version>.tar
# and its SHA-256 are uploaded to the same release. Nothing runs from a pull request.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds the unsigned image, for example v0.74.0"
        required: true
      unsigned_sha256:
        description: "SHA-256 of the unsigned image, computed by you when you attached it"
        required: true
      devices:
        description: "supported_devices, space separated; each is a router's whole /tmp/sysinfo/board_name, which has a comma (Tozed,X28)"
        required: true
        default: "Tozed,X28"

permissions:
  contents: read

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write   # to attach the signed file to the release
    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.unsigned_sha256 }}
          DEVICES: ${{ inputs.devices }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$' || { echo "bad tag"; exit 1; }
          echo "$SHA" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad sha256"; exit 1; }
          echo "$DEVICES" | grep -Eq '^[A-Za-z0-9,._-]+( [A-Za-z0-9,._-]+)*$' || { echo "bad device list"; exit 1; }

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Fetch the unsigned image and the bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.unsigned_sha256 }}
        run: |
          mkdir -p work && cd work
          VERSION=${TAG#v}
          gh release download "$TAG" -p "x28-sysupgrade-${VERSION}-unsigned.tar" -p "x28-assembly-*.tar.gz" -p SHA256SUMS
          echo "$SHA  x28-sysupgrade-${VERSION}-unsigned.tar" | sha256sum -c -
          grep " x28-assembly-" SHA256SUMS | sha256sum -c -
          tar -xzf x28-assembly-*.tar.gz --wildcards '*/openwrt-*-armsr-armv8-rootfs.tar.gz' --strip-components=1
          ls openwrt-*-rootfs.tar.gz

      - name: Sign
        env:
          SIGNER_KEY: ${{ secrets.X28_IMAGE_SIGNER_KEY }}
          SIGNER_CERT: ${{ secrets.X28_IMAGE_SIGNER_CERT }}
          TAG: ${{ inputs.tag }}
          DEVICES: ${{ inputs.devices }}
        run: |
          set +x
          umask 077
          cd work
          VERSION=${TAG#v}
          printf '%s\n' "$SIGNER_KEY" > signer.sec
          printf '%s' "$SIGNER_CERT" | base64 -d > signer.ucert   # the ucert blob is binary; the secret holds it base64-encoded
          devs=$(echo "$DEVICES" | sed 's/ /","/g')   # one entry per board name; fwtool.sh compares each with the whole board_name
          printf '{"supported_devices":["%s"],"version":{"release":"%s","kernel":"4.19.205"}}\n' "$devs" "$TAG" > meta.json
          cp "x28-sysupgrade-${VERSION}-unsigned.tar" "x28-sysupgrade-${VERSION}.tar"
          export X28_ROOTFS="$PWD/$(ls openwrt-*-rootfs.tar.gz | head -n1)"
          sh ../tools/build/image_sign.sh sign "x28-sysupgrade-${VERSION}.tar" meta.json signer.sec signer.ucert
          shred -u signer.sec signer.ucert 2>/dev/null || rm -f signer.sec signer.ucert

      - name: Verify with the feed's public key, as the router does
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cd work
          VERSION=${TAG#v}
          export X28_ROOTFS="$PWD/$(ls openwrt-*-rootfs.tar.gz | head -n1)"
          mkdir keys && cp ../package/x28-feed/files/x28-feed.pub keys/7fec994ab0d15b97
          sh ../tools/build/image_sign.sh verify "x28-sysupgrade-${VERSION}.tar" keys
          sh ../tools/build/image_sign.sh meta "x28-sysupgrade-${VERSION}.tar"

      - name: Attach the signed image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd work
          VERSION=${TAG#v}
          sha256sum "x28-sysupgrade-${VERSION}.tar" > "x28-sysupgrade-${VERSION}.tar.sha256"
          gh release upload "$TAG" "x28-sysupgrade-${VERSION}.tar" "x28-sysupgrade-${VERSION}.tar.sha256" --clobber
