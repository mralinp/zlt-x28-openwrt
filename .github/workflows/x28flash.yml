name: x28flash

# Host tests and release binaries for the Rust USB backup tool (tools/x28flash, #240).
# Binaries are uploaded as workflow artifacts; the download agent is never part of them.

on:
  pull_request:
    paths: ['tools/x28flash/**', '.github/workflows/x28flash.yml']
  push:
    branches: [main]
    paths: ['tools/x28flash/**', '.github/workflows/x28flash.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/x28flash

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/x28flash
          [ -f "$bin.exe" ] && bin="$bin.exe"
          name=x28flash-${{ matrix.target }}${bin##*x28flash}
          cp "$bin" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name"; else shasum -a 256 "$name"; fi > "$name.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: x28flash-${{ matrix.target }}
          path: |
            tools/x28flash/${{ env.NAME }}
            tools/x28flash/${{ env.NAME }}.sha256
