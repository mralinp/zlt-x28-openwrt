# Builds the x28-flasher single binary (PyInstaller, one folder) from the pinned, patched mtkclient (#272, docs/research/x28-flasher-binary.md).
# Frozen builds are READ-ONLY (flash is refused) until the build-time equality gate exists. The vendor download agent is never bundled.
# Windows is not built yet: build_binary.py assumes the POSIX venv layout and nobody can test it on a real host.
name: x28-flasher

on:
  workflow_dispatch:
  workflow_call:  # used by release.yml
  pull_request:
    paths:
      - "tools/x28-flasher/**"
      - "tools/recovery/**"
      - "tools/build/package_ubi.py"
      - "tools/build/stage_native.py"
      - "tools/build/ab_guard.py"
      - ".github/workflows/x28-flasher.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: libusb
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install libusb; else sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0; fi

      - name: Pinned mtkclient and build venv
        run: |
          COMMIT="$(python3 -c "import sys; sys.path.insert(0, 'tools/recovery'); import common; print(common.MTKCLIENT_COMMIT)")"
          mkdir -p bh/src
          git -C bh/src init -q
          git -C bh/src fetch -q --depth 1 https://github.com/bkerler/mtkclient.git "$COMMIT"
          git -C bh/src -c advice.detachedHead=false checkout -q FETCH_HEAD
          python3 -m venv bh/venv
          bh/venv/bin/pip install -q pycryptodome pycryptodomex pyserial pyusb colorama questionary pyinstaller

      - name: Build
        run: bh/venv/bin/python tools/x28-flasher/build_binary.py --home bh --out dist

      - name: Smoke test the frozen binary
        run: |
          B=dist/x28-flasher/x28-flasher
          "$B" --selftest
          want="$(python3 -c "import json; print(json.load(open('dist/x28-flasher/_internal/identity.json'))['xml_lib_sha256'])")"
          test "$("$B" identity)" = "$want"
          if "$B" flash identical --candidate-dir x </dev/null 2>err.txt; then echo "frozen flash must be refused"; exit 1; fi
          grep -q "read-only" err.txt

      - name: Package
        run: |
          tar -C dist -czf "x28-flasher-${{ matrix.name }}.tar.gz" x28-flasher
          if command -v sha256sum >/dev/null; then sha256sum "x28-flasher-${{ matrix.name }}.tar.gz"; else shasum -a 256 "x28-flasher-${{ matrix.name }}.tar.gz"; fi | tee "x28-flasher-${{ matrix.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: x28-flasher-${{ matrix.name }}
          path: |
            x28-flasher-${{ matrix.name }}.tar.gz
            x28-flasher-${{ matrix.name }}.tar.gz.sha256
