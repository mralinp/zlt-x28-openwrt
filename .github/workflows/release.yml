name: Release

# A merge to main that touches the paths below is a release (docs-only and CI-only merges are not; run this by hand to force one): CI and the builds run,
# the next SemVer is derived from the Conventional Commits since the last vX.Y.Z tag
# (scripts/release.py), then the tag and a GitHub release are created. 0.x releases are
# pre-releases. Asset is the OPEN userspace (the flasher lives in mralinp/x28-flasher): vendor files never enter this public repo.

on:
  push:
    branches: [main]
    paths:  # only what ends up in the release assets: userspace build inputs
      - "tools/build/**"
      - "package/iwinfo-mtwifi/**"
      - "package/x28-feed/**"
      - "package/x28-bootok/**"
      - "package/x28-dhcp/**"
      - "package/x28-kmods/**"
      - "package/x28-leds/**"
      - "package/x28-mipc/**"
      - "package/x28-modem/**"
      - "package/x28-storage/**"
      - "package/x28-sysupgrade/**"
      - "package/x28-wifi/**"
      - "package/x28-kmod-stubs/**"
      - "package/luci-proto-x28-mipc/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/userspace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  userspace:
    uses: ./.github/workflows/userspace.yml

  release:
    needs: [ci, userspace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          if git tag --points-at HEAD | grep -q '^v[0-9]'; then
            echo "HEAD is already released: $(git tag --points-at HEAD)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(python3 scripts/release.py next-version)"
          echo "Next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: x28-userspace-23.05.5
          path: userspace

      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # One bundle with everything the flasher needs to assemble the image; see docs/BUILD.md.
          B="x28-assembly-v${VERSION}"
          mkdir -p assets "$B/overlay" "$B/kmods" "$B/ipk"
          cp userspace/*-rootfs.tar.gz "$B/openwrt-23.05.5-armsr-armv8-rootfs.tar.gz"
          cp userspace/*.manifest "$B/userspace.manifest"
          # The package files first_boot.py reads (X28_OVERLAY).
          tar -cf - package/luci-proto-x28-mipc package/x28-bootok/files package/x28-dhcp/files package/x28-feed/files package/x28-kmod-stubs/stubs.txt package/x28-kmods/files package/x28-leds/files package/x28-mipc/files package/x28-modem/files package/x28-storage/files package/x28-sysupgrade/files package/x28-wifi/files | tar -xf - -C "$B/overlay"
          # One set of ipks for the image and the signed feed (#419). The x28-* packages need no SDK: built here, byte for byte
          # what the feed is cut from. The module packages are built locally against the private SDK tree and sit on the
          # newest feed release, which is updated in place; they are taken from there by the hashes in package/x28-kmods/ipk.sha256,
          # so this job never waits for signing, and a changed file fails here instead of shipping.
          python3 tools/build/release_check.py x28 --out "$B/ipk"
          gh release download --dir "$B/ipk" $(awk '{print "-p " $2}' package/x28-kmods/ipk.sha256)
          python3 tools/build/release_check.py fetch "$B/ipk" || { echo "package/x28-kmods/ipk.sha256 is out of date: run release_check.py pin"; exit 1; }
          # first_boot.py reads the eight image modules as .ko files until it reads ipks (#420).
          python3 tools/build/release_check.py kmods "$B/ipk" --out "$B/kmods"
          (cd "$B/kmods" && sha256sum -- *.ko > SHA256SUMS)
          # ipset from the feed-2 release; alsa-lib and libstdcpp6 from OpenWrt 23.05.5, pinned by hash.
          gh release download feed-2 -D "$B/ipk" -p 'ipset_*' -p 'libipset13_*' -p 'x28-ipset-kernel_*'
          R=https://downloads.openwrt.org/releases/23.05.5
          curl -fsSL -o "$B/ipk/alsa-lib_1.2.9-1_aarch64_cortex-a53.ipk" "$R/packages/aarch64_cortex-a53/packages/alsa-lib_1.2.9-1_aarch64_cortex-a53.ipk"
          curl -fsSL -o "$B/ipk/libstdcpp6_12.3.0-4_aarch64_generic.ipk" "$R/targets/armsr/armv8/packages/libstdcpp6_12.3.0-4_aarch64_generic.ipk"
          echo "4cca89805578f18778b5da41221256c2f87ea33cd1dfd083d151ed936cd9db37  $B/ipk/alsa-lib_1.2.9-1_aarch64_cortex-a53.ipk
          3f174e78dead3941736971da0bd99a2b4dd0b3411bbd6ea4870ae677c49dfef4  $B/ipk/libstdcpp6_12.3.0-4_aarch64_generic.ipk" | sha256sum -c
          (cd "$B" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar --owner=0 --group=0 --numeric-owner -czf "assets/$B.tar.gz" "$B"
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRE=""
          case "$VERSION" in 0.*) PRE="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          **Beta pre-release.** The attached assembly bundle holds the open OpenWrt 23.05.5 userspace, our package
          files, kernel modules and extra packages. It does not boot the X28 by itself: the stock kernel and vendor
          binaries are added by the flasher from your own unit's backup. The native image has been flashed to slot A and boots on one tested unit; flashing it
          is a guarded, owner-approved procedure that needs UART and a verified backup. The flasher is the
          separate mralinp/x28-flasher repo. See docs/BUILD.md,
          docs/RECOVERY.md and CHANGELOG.md.
          EOF
          gh release create "v$VERSION" assets/* --title "v$VERSION" --notes-file notes.md --generate-notes --verify-tag --latest=false $PRE
