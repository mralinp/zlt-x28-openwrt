name: Release

# Every merge to main is a release (same flow as MQute): CI and the userspace build run,
# the next SemVer is derived from the Conventional Commits since the last vX.Y.Z tag
# (scripts/release.py), then the tag and a GitHub release are created. 0.x releases are
# pre-releases. Assets are the OPEN userspace only: vendor files never enter this public repo.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  userspace:
    uses: ./.github/workflows/userspace.yml

  release:
    needs: [ci, userspace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          if git tag --points-at HEAD | grep -q '^v[0-9]'; then
            echo "HEAD is already released: $(git tag --points-at HEAD)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(python3 scripts/release.py next-version)"
          echo "Next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: x28-userspace-23.05.5
          path: userspace

      - name: Release assets
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir assets
          cp userspace/*-rootfs.tar.gz "assets/x28-userspace-v${VERSION}-openwrt-23.05.5-armsr-armv8-rootfs.tar.gz"
          cp userspace/*.manifest "assets/x28-userspace-v${VERSION}.manifest"
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS

      - name: Tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRE=""
          case "$VERSION" in 0.*) PRE="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          **Beta pre-release.** The attached rootfs is the open OpenWrt 23.05.5 userspace only. It does not boot
          the X28 by itself: the stock kernel, modules and vendor binaries are added locally from your own
          unit's backup, and flashing stays blocked until UART recovery is proven. See docs/BUILD.md and docs/RECOVERY.md.
          EOF
          gh release create "v$VERSION" assets/* --title "v$VERSION" --notes-file notes.md --generate-notes --verify-tag $PRE
