name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/release.py check-title "$TITLE"

  selfcheck:
    name: Self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release.py selftest
      - run: python3 tools/build/test_feed_release.py
      - run: python3 -c "import sys; sys.path.insert(0, 'scripts'); import changelog; changelog.selftest()"
      - run: python3 tools/firmware/inventory.py selftest
      - run: python3 tools/build/test_kmod_stub_feed.py
      - run: python3 tools/build/test_vendor_ipset.py
      - run: python3 tools/build/test_x28_kmods.py
      - run: python3 tools/build/test_release_check.py
      - run: sh package/x28-leds/files/x28-leds selftest
      - run: sh package/x28-dhcp/files/x28-dhcp-guard selftest
      - run: sh package/x28-mipc/files/x28-apn selftest
      - run: sh tests/test_wifi.sh
      - run: sh tests/test_wps.sh
      - run: sh tests/test_mtwifi_scan.sh
      - run: sh tests/test_modem.sh
      - run: sh tests/test_bootok.sh
      - run: sh tests/test_user_data.sh
