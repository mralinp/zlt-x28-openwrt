<%+header%>
<h2>DMZ</h2>
<div class="cbi-map"><div class="cbi-section">
<div class="cbi-value"><label class="cbi-value-title">Enable</label><input type="checkbox" id="en"></div>
<div class="cbi-value"><label class="cbi-value-title">DMZ host IP</label><input type="text" id="ip" placeholder="192.168.70.x"></div>
<div class="cbi-page-actions"><button class="cbi-button cbi-button-save" onclick="save()">Save</button> <span id="msg"></span></div>
</div></div>
<%+vendor/_js%>
<script>
const msg = t => document.getElementById('msg').textContent = t;
function load() {
	vcall({cmd:172, method:'GET', subcmd:6}).then(r => {
		en.checked = r.enabled == '1'; ip.value = r.ip || ''; if (r.message) msg(r.message);
	});
}
function save() {
	if (en.checked && !/^(\d{1,3}\.){3}\d{1,3}$/.test(ip.value)) return msg('Invalid IP');
	vcall({cmd:172, method:'POST', subcmd:6, enabled: en.checked ? '1' : '0', ip: en.checked ? ip.value : ''})
		.then(r => { msg(r.success == 1 ? 'Saved' : 'Failed'); load(); });
}
load();
</script>
<%+footer%>
