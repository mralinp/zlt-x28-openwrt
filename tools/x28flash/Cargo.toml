[package]
name = "x28flash"
version = "0.1.0"
edition = "2021"
description = "Read-only USB backup tool for the ZLT X28 (MediaTek MT6890), no libusb needed"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", default-features = false }
indicatif = "0.17"
nusb = "0.2"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
codegen-units = 1
