# The x28-* packages as .ipk files (#417). The feed builder (tools/build/kmod_stub_feed.py) reads this, so the image and
# the feed carry the same files. The truth for paths and modes is what the flasher puts in the image today
# (x28-flasher tools/build/first_boot.py): the OpenWrt Makefiles next to the sources are incomplete (they miss x28-wps,
# x28-wifi-l1 and the regions) and their DEPENDS name two things that are not packages on the unit (mipc-wan, the vendor MIPC
# stack, and flock), so Depends here lists only what resolves.
#
# files: one per line, `<mode> <destination> <source relative to package/> [conf]`. conf marks a config file that is kept if the
#        user changed it. Every /etc/init.d script is enabled on install (its own START/STOP) and disabled on removal; an
#        image build enables them itself (IPKG_INSTROOT is set).
# version + release: bump release whenever the files of a package change; opkg only upgrades to a higher version.
#
# x28-base depends on every other package here (and the module loader and the kernel record), so `opkg remove` of one of them
# is refused until x28-base itself is removed. A test keeps that list complete.

[x28-bootok]
version = 0.1.0
release = 1
depends = dropbear
description = Reset the slot-A boot tries after a good boot (X28 A/B boot counter)
files =
    0755 /etc/init.d/x28-bootok x28-bootok/files/x28-bootok.init

[x28-dhcp]
version = 0.1.0
release = 1
depends = dnsmasq
description = Restart dnsmasq if it came up without a DHCP range
files =
    0755 /etc/init.d/x28-dhcp x28-dhcp/files/x28-dhcp.init
    0755 /usr/libexec/x28-dhcp-guard x28-dhcp/files/x28-dhcp-guard

[x28-leds]
version = 0.1.0
release = 1
depends = jsonfilter
description = X28 front LEDs (power, Wi-Fi, 4G, 5G, signal) through the vendor tz_gpio_leds driver; needs the vendor MIPC stack from the image
files =
    0755 /sbin/x28-leds x28-leds/files/x28-leds
    0755 /etc/init.d/x28-leds x28-leds/files/x28-leds.init

[x28-modem]
version = 0.1.0
release = 1
depends = x28-mipc
description = Start the X28 modem stack at boot (vendor daemons, mounts, USB gadget); the vendor stack itself comes from the image
files =
    0755 /etc/init.d/x28-modem x28-modem/files/x28-modem.init

[x28-mipc]
version = 0.1.0
release = 2
depends = netifd jshn
description = Native X28 MIPC netifd protocol (IPv4, IPv6, APN from SIM) and its helpers; needs the vendor MIPC stack from the image
files =
    0755 /lib/netifd/proto/x28_mipc.sh x28-mipc/files/x28_mipc.sh
    0755 /sbin/x28-apn x28-mipc/files/x28-apn
    0755 /sbin/x28-modem-status x28-mipc/files/x28-modem-status
    0755 /sbin/x28-plmn-scan x28-mipc/files/x28-plmn-scan

[luci-proto-x28-mipc]
version = 0.1.0
release = 2
depends = luci-base x28-mipc
description = LuCI support for the native X28 MIPC protocol
files =
    0644 /www/luci-static/resources/protocol/x28_mipc.js luci-proto-x28-mipc/htdocs/luci-static/resources/protocol/x28_mipc.js
    0644 /usr/share/rpcd/acl.d/luci-proto-x28-mipc.json luci-proto-x28-mipc/root/usr/share/rpcd/acl.d/luci-proto-x28-mipc.json

[x28-wifi]
version = 0.1.0
release = 1
depends = netifd
description = netifd wireless handler for the X28 MT7915 (mt_wifi) with WPS, the l1profile matcher and the region tables; needs the vendor mt_wifi module from the image
files =
    0755 /lib/netifd/wireless/mtwifi.sh x28-wifi/files/mtwifi.sh
    0644 /lib/wifi/mtwifi.sh x28-wifi/files/mtwifi.detect
    0755 /sbin/x28-wps x28-wifi/files/x28-wps
    0755 /etc/init.d/x28-wps x28-wifi/files/x28-wps.init
    0755 /sbin/x28-wifi-l1 x28-wifi/files/x28-wifi-l1
    0755 /etc/init.d/x28-wifi-l1 x28-wifi/files/x28-wifi-l1.init
    0644 /usr/share/x28-wifi/regions x28-wifi/files/regions
    0644 /usr/share/x28-wifi/channels5 x28-wifi/files/channels5

[x28-storage]
version = 0.1.0
release = 1
description = Attach the user_data partition as the overlay (extroot), so the unit has 278 MB for settings and packages; removing this drops the overlay at the next boot
files =
    0644 /lib/preinit/79_x28_user_data x28-storage/files/x28-user-data.preinit
    0644 /etc/config/fstab x28-storage/files/fstab conf

[x28-switch]
version = 0.1.0
release = 2
description = Load the observed MT7531AE VLAN table at boot so the four LAN sockets work, and describe the switch layout to LuCI (/etc/board.json); needs swconfig and the vendor switch driver from the image, and the switch sections the image writes in /etc/config/network
files =
    0755 /etc/init.d/x28-switch x28-switch/files/x28-switch.init
    0644 /etc/board.json x28-switch/files/board.json

[x28-update]
version = 0.1.0
release = 2
depends = luci-base uclient-fetch
description = LuCI Overview notice when a newer signed X28 image is released on GitHub (check cached in /tmp; reads the running version from /etc/x28-release) and x28-upgrade, which downloads and flashes it only when asked (-y or the confirmed LuCI button)
files =
    0755 /usr/libexec/x28-update-check x28-update/files/x28-update-check
    0755 /usr/sbin/x28-upgrade x28-update/files/x28-upgrade
    0644 /www/luci-static/resources/view/status/include/05_x28update.js x28-update/htdocs/luci-static/resources/view/status/include/05_x28update.js
    0644 /usr/share/rpcd/acl.d/x28-update.json x28-update/root/usr/share/rpcd/acl.d/x28-update.json

[x28-base]
version = 0.1.0
release = 3
depends = kernel x28-kmods x28-storage x28-bootok x28-dhcp x28-leds x28-modem x28-mipc luci-proto-x28-mipc x28-wifi x28-switch x28-nrband x28-update
description = What the X28 needs to work: the 5G modem and its LuCI page, the LAN DHCP guard, the LAN switch, the 5G band tool, Wi-Fi, LEDs, the A/B boot counter reset, the update notice, the module loader and the overlay. Removing a member is refused while this is installed
